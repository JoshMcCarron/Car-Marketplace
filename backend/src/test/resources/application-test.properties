# In-memory SQLite for tests — the production car_marketplace.db file is never touched.
# cache=shared lets all HikariCP connections share the same in-memory database;
# maximum-pool-size=1 is required because SQLite only supports one concurrent writer.
spring.datasource.url=jdbc:sqlite:file:testdb?mode=memory&cache=shared
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.hibernate.ddl-auto=create-drop
