spring.application.name=car-marketplace

# PostgreSQL Database Configuration
# Override any of these via environment variables; DB_PASSWORD has no default and must be set.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:car_marketplace}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

#spring.jpa.show-sql=true
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#spring.jpa.hibernate.ddl-auto=create-drop

# JWT Configuration
# Production deployments should override jwt.secret via the JWT_SECRET environment variable
jwt.secret=dFR4eW1qQmhOWlFTdW5iTzl3YktuUlJKTVVXeXBHZEE=
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://18.214.94.81:3000

# JPA / Hibernate
spring.jpa.open-in-view=false

# Silence expected Spring Security warning: AuthenticationProvider bean takes precedence
# over UserDetailsService auto-config — this is intentional (DaoAuthenticationProvider wires
# CustomUserDetailsService explicitly).
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

