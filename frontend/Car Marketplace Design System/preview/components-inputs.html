<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label">Components · Form Inputs</div>
  <div style="display:flex; flex-direction:column; gap:14px">
    <div>
      <div style="font-size:13px; font-weight:600; color:#0E0E10; margin-bottom:6px">Email Address</div>
      <input value="alex@email.com" style="width:100%; padding:12px 14px; border:1px solid #E2DFD5; border-radius:10px; font-family:Poppins; font-size:15px; color:#0E0E10; outline:none"/>
    </div>
    <div>
      <div style="font-size:13px; font-weight:600; color:#0E0E10; margin-bottom:6px">Password</div>
      <input value="••••••••••" style="width:100%; padding:12px 14px; border:2px solid #FECE14; border-radius:10px; font-family:Poppins; font-size:15px; color:#0E0E10; outline:none; box-shadow:0 0 0 3px rgba(254,206,20,0.18)"/>
      <div style="font-size:12px; color:#6F6B60; margin-top:6px">Focused state — 2px yellow ring.</div>
    </div>
    <div style="display:flex; gap:12px">
      <div style="flex:1">
        <div style="font-size:13px; font-weight:600; color:#0E0E10; margin-bottom:6px">Brand</div>
        <select style="width:100%; padding:12px 14px; border:1px solid #E2DFD5; border-radius:10px; font-family:Poppins; font-size:15px; color:#0E0E10; background:#fff"><option>Toyota</option></select>
      </div>
      <div style="flex:1">
        <div style="font-size:13px; font-weight:600; color:#C8311E; margin-bottom:6px">Card Number</div>
        <input value="1234 5678 9012" style="width:100%; padding:12px 14px; border:1px solid #C8311E; border-radius:10px; font-family:Poppins; font-size:15px; color:#0E0E10; background:#FBEAE7; outline:none"/>
      </div>
    </div>
  </div>
</div>
</body></html>
