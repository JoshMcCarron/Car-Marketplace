<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label">Components · Badges &amp; Filter Chips</div>
  <div style="display:flex; flex-direction:column; gap:12px">
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
      <span style="padding:4px 10px; background:#C8311E; color:#fff; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:0.04em">🔥 HOT DEAL</span>
      <span style="padding:4px 10px; background:#FECE14; color:#0E0E10; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:0.04em">NEW</span>
      <span style="padding:4px 10px; background:#0E0E10; color:#fff; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:0.04em">CERTIFIED</span>
      <span style="padding:4px 10px; background:#E6F5EC; color:#1F8A4C; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:0.04em">IN STOCK</span>
      <span style="padding:4px 10px; background:#FFF4D6; color:#B7791F; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:0.04em">LOW MILEAGE</span>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
      <span style="padding:6px 12px; background:#EFEDE6; color:#0E0E10; border-radius:999px; font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:6px">Brand: Toyota <span style="color:#9C9789; font-size:14px">×</span></span>
      <span style="padding:6px 12px; background:#EFEDE6; color:#0E0E10; border-radius:999px; font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:6px">Year: 2023 <span style="color:#9C9789; font-size:14px">×</span></span>
      <span style="padding:6px 12px; background:#FBEAE7; color:#C8311E; border-radius:999px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px">Hot Deals Only <span style="font-size:14px">×</span></span>
      <button style="padding:6px 12px; background:transparent; color:#6F6B60; border:1px dashed #C9C4B6; border-radius:999px; font-size:13px; font-weight:500; font-family:Poppins">Clear all</button>
    </div>
  </div>
</div>
</body></html>
