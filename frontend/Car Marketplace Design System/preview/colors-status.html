<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label">Status · Semantic Colors</div>
  <div class="row row--gap-lg">
    <div class="swatch">
      <div class="swatch__chip" style="background:#1F8A4C"></div>
      <div class="swatch__name">Success</div>
      <div class="swatch__hex">#1F8A4C</div>
    </div>
    <div class="swatch">
      <div class="swatch__chip" style="background:#C8311E"></div>
      <div class="swatch__name">Danger / Sale</div>
      <div class="swatch__hex">#C8311E</div>
    </div>
    <div class="swatch">
      <div class="swatch__chip" style="background:#B7791F"></div>
      <div class="swatch__name">Warning</div>
      <div class="swatch__hex">#B7791F</div>
    </div>
    <div class="swatch">
      <div class="swatch__chip" style="background:#1B5FA0"></div>
      <div class="swatch__name">Info</div>
      <div class="swatch__hex">#1B5FA0</div>
    </div>
  </div>
  <div class="row" style="gap:10px; margin-top:4px">
    <div style="flex:1; padding:10px 14px; border-radius:8px; background:#E6F5EC; color:#1F8A4C; font-size:13px; font-weight:600">Payment successful!</div>
    <div style="flex:1; padding:10px 14px; border-radius:8px; background:#FBEAE7; color:#C8311E; font-size:13px; font-weight:600">Invalid email or password.</div>
    <div style="flex:1; padding:10px 14px; border-radius:8px; background:#FFF4D6; color:#B7791F; font-size:13px; font-weight:600">Processing payment…</div>
  </div>
</div>
</body></html>
