<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label">Components · Buttons</div>
  <div style="display:flex; flex-direction:column; gap:14px">
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap">
      <button style="padding:12px 22px; background:#FECE14; color:#0E0E10; border:none; border-radius:10px; font-family:Poppins; font-weight:600; font-size:15px; cursor:pointer">Add to Cart</button>
      <button style="padding:12px 22px; background:#E8B900; color:#0E0E10; border:none; border-radius:10px; font-family:Poppins; font-weight:600; font-size:15px">Add to Cart</button>
      <button style="padding:12px 22px; background:#C99E00; color:#0E0E10; border:none; border-radius:10px; font-family:Poppins; font-weight:600; font-size:15px; transform:scale(0.98)">Add to Cart</button>
      <span style="font-family:var(--font-mono); font-size:11px; color:#6F6B60">Primary · rest / hover / press</span>
    </div>
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap">
      <button style="padding:12px 22px; background:#0E0E10; color:#fff; border:none; border-radius:10px; font-family:Poppins; font-weight:600; font-size:15px">Complete Payment</button>
      <button style="padding:12px 22px; background:transparent; color:#0E0E10; border:1px solid #0E0E10; border-radius:10px; font-family:Poppins; font-weight:600; font-size:15px">Back to Cart</button>
      <button style="padding:12px 22px; background:transparent; color:#9C9789; border:1px solid #E2DFD5; border-radius:10px; font-family:Poppins; font-weight:600; font-size:15px">Disabled</button>
      <span style="font-family:var(--font-mono); font-size:11px; color:#6F6B60">Dark · outline · disabled</span>
    </div>
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap">
      <button style="padding:8px 14px; background:#FECE14; color:#0E0E10; border:none; border-radius:8px; font-family:Poppins; font-weight:600; font-size:13px">Sm</button>
      <button style="padding:14px 28px; background:#FECE14; color:#0E0E10; border:none; border-radius:10px; font-family:Poppins; font-weight:600; font-size:16px">Default</button>
      <button style="padding:18px 36px; background:#FECE14; color:#0E0E10; border:none; border-radius:12px; font-family:Poppins; font-weight:700; font-size:18px">Large CTA</button>
      <span style="font-family:var(--font-mono); font-size:11px; color:#6F6B60">Sizes</span>
    </div>
  </div>
</div>
</body></html>
