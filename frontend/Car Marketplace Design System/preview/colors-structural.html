<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label">Brand · Structural</div>
  <div class="row row--gap-lg">
    <div class="swatch">
      <div class="swatch__chip" style="background:#0E0E10; height:96px"></div>
      <div class="swatch__name">Black</div>
      <div class="swatch__hex">#0E0E10</div>
    </div>
    <div class="swatch">
      <div class="swatch__chip" style="background:#1A1A1D"></div>
      <div class="swatch__name">Ink</div>
      <div class="swatch__hex">#1A1A1D</div>
    </div>
    <div class="swatch">
      <div class="swatch__chip" style="background:#FFFFFF"></div>
      <div class="swatch__name">White</div>
      <div class="swatch__hex">#FFFFFF</div>
    </div>
    <div class="swatch">
      <div class="swatch__chip" style="background:#FAF7EE"></div>
      <div class="swatch__name">Cream</div>
      <div class="swatch__hex">#FAF7EE</div>
    </div>
  </div>
</div>
</body></html>
