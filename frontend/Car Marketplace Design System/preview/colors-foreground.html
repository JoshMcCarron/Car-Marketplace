<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label">Foreground · Text Roles</div>
  <div style="display:flex; flex-direction:column; gap:10px">
    <div style="display:flex; align-items:baseline; gap:16px"><span style="font-family:var(--font-mono); font-size:11px; color:#6F6B60; min-width:120px">--color-fg-1</span><span style="font-size:18px; color:#0E0E10; font-weight:600">Primary text — headings &amp; key UI</span></div>
    <div style="display:flex; align-items:baseline; gap:16px"><span style="font-family:var(--font-mono); font-size:11px; color:#6F6B60; min-width:120px">--color-fg-2</span><span style="font-size:16px; color:#4A4740">Body — paragraphs &amp; descriptive copy</span></div>
    <div style="display:flex; align-items:baseline; gap:16px"><span style="font-family:var(--font-mono); font-size:11px; color:#6F6B60; min-width:120px">--color-fg-3</span><span style="font-size:14px; color:#6F6B60">Meta — captions, timestamps, helper</span></div>
    <div style="display:flex; align-items:baseline; gap:16px; padding:8px 12px; background:#0E0E10; border-radius:6px"><span style="font-family:var(--font-mono); font-size:11px; color:#9C9789; min-width:108px">--fg-on-dark</span><span style="font-size:16px; color:#FFFFFF; font-weight:500">On dark surfaces</span></div>
    <div style="display:flex; align-items:baseline; gap:16px; padding:8px 12px; background:#FECE14; border-radius:6px"><span style="font-family:var(--font-mono); font-size:11px; color:#4A4740; min-width:108px">--fg-on-yellow</span><span style="font-size:16px; color:#0E0E10; font-weight:600">On yellow surfaces</span></div>
  </div>
</div>
</body></html>
