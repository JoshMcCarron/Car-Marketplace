<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label">Components · Chat Widget</div>
  <div style="display:flex; gap:18px; align-items:flex-end">
    <div style="width:300px; background:#fff; border:1px solid #E2DFD5; border-radius:14px; box-shadow:0 16px 40px rgba(14,14,16,0.14); overflow:hidden">
      <div style="padding:12px 14px; background:#0E0E10; color:#fff; display:flex; justify-content:space-between; align-items:center">
        <div style="font-size:13px; font-weight:600">Marketplace Assistant</div>
        <div style="font-size:14px; color:#9C9789">×</div>
      </div>
      <div style="padding:12px; background:#F8F7F4; display:flex; flex-direction:column; gap:8px">
        <div style="align-self:flex-start; padding:8px 12px; background:#fff; border:1px solid #EFEDE6; border-radius:14px 14px 14px 4px; font-size:12px; max-width:80%">Welcome! How can I help?</div>
        <div style="align-self:flex-end; padding:8px 12px; background:#FECE14; color:#0E0E10; border-radius:14px 14px 4px 14px; font-size:12px; max-width:80%; font-weight:500">Show me Toyota vehicles</div>
        <div style="align-self:flex-start; padding:8px 12px; background:#fff; border:1px solid #EFEDE6; border-radius:14px 14px 14px 4px; font-size:12px; max-width:80%">Found 8 Toyotas. Want to filter by year?</div>
      </div>
      <div style="padding:10px; display:flex; gap:6px; border-top:1px solid #EFEDE6">
        <input placeholder="Ask about our vehicles…" style="flex:1; padding:8px 12px; border:1px solid #E2DFD5; border-radius:999px; font-size:12px; font-family:Poppins; outline:none"/>
        <button style="padding:8px 14px; background:#0E0E10; color:#fff; border:none; border-radius:999px; font-family:Poppins; font-weight:600; font-size:12px">Send</button>
      </div>
    </div>
    <div style="display:flex; flex-direction:column; gap:10px; align-items:center">
      <button style="width:56px; height:56px; border-radius:50%; background:#FECE14; color:#0E0E10; border:none; box-shadow:0 8px 24px rgba(254,206,20,0.45); font-size:24px; cursor:pointer">💬</button>
      <span style="font-family:var(--font-mono); font-size:11px; color:#6F6B60">Toggle</span>
    </div>
  </div>
</div>
</body></html>
