<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label">Type · Price Treatment</div>
  <div style="display:flex; gap:24px; align-items:flex-end; flex-wrap:wrap">
    <div>
      <div style="font-size:11px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:#6F6B60; margin-bottom:6px">Hero</div>
      <div style="font-size:48px; font-weight:800; color:#0E0E10; letter-spacing:-0.02em; line-height:1">$24,999</div>
    </div>
    <div>
      <div style="font-size:11px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:#6F6B60; margin-bottom:6px">Card</div>
      <div style="font-size:24px; font-weight:700; color:#0E0E10; line-height:1">$18,500</div>
    </div>
    <div>
      <div style="font-size:11px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:#C8311E; margin-bottom:6px">Sale</div>
      <div style="display:flex; align-items:baseline; gap:10px; line-height:1">
        <span style="font-size:24px; font-weight:700; color:#C8311E">$15,800</span>
        <span style="font-size:16px; color:#9C9789; text-decoration:line-through; font-weight:500">$18,500</span>
      </div>
    </div>
    <div>
      <div style="font-size:11px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:#6F6B60; margin-bottom:6px">Inline</div>
      <div style="font-size:16px; font-weight:600; color:#0E0E10; line-height:1">From $9,400 / yr</div>
    </div>
  </div>
</div>
</body></html>
