<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label">Components · Vehicle Card</div>
  <div style="display:flex; gap:16px">
    <div style="flex:1; background:#fff; border:1px solid #E2DFD5; border-radius:10px; overflow:hidden; box-shadow:0 2px 6px rgba(14,14,16,0.08)">
      <div style="height:120px; background:#EFEDE6; display:flex; align-items:center; justify-content:center; color:#9C9789; font-size:12px; font-weight:500">Vehicle Image</div>
      <div style="padding:14px">
        <div style="font-size:16px; font-weight:600; color:#0E0E10; margin-bottom:4px">Toyota Corolla</div>
        <div style="font-size:13px; color:#6F6B60; margin-bottom:10px">2023 · 24,500 km</div>
        <div style="display:flex; justify-content:space-between; align-items:center">
          <div style="font-size:18px; font-weight:700; color:#0E0E10">$18,500</div>
          <button style="padding:7px 12px; background:#FECE14; color:#0E0E10; border:none; border-radius:8px; font-family:Poppins; font-weight:600; font-size:12px">Add</button>
        </div>
      </div>
    </div>
    <div style="flex:1; background:#fff; border:2px solid #C8311E; border-radius:10px; overflow:hidden; box-shadow:0 2px 6px rgba(14,14,16,0.08); position:relative">
      <div style="position:absolute; top:10px; left:10px; padding:4px 10px; background:#C8311E; color:#fff; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:0.04em">🔥 HOT DEAL</div>
      <div style="height:120px; background:#EFEDE6; display:flex; align-items:center; justify-content:center; color:#9C9789; font-size:12px; font-weight:500">Vehicle Image</div>
      <div style="padding:14px">
        <div style="font-size:16px; font-weight:600; color:#0E0E10; margin-bottom:4px">Honda Civic</div>
        <div style="font-size:13px; color:#6F6B60; margin-bottom:10px">2022 · 41,200 km</div>
        <div style="display:flex; justify-content:space-between; align-items:center">
          <div style="display:flex; align-items:baseline; gap:6px"><span style="font-size:18px; font-weight:700; color:#C8311E">$15,800</span><span style="font-size:12px; color:#9C9789; text-decoration:line-through">$18,500</span></div>
          <button style="padding:7px 12px; background:#FECE14; color:#0E0E10; border:none; border-radius:8px; font-family:Poppins; font-weight:600; font-size:12px">Add</button>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
